[package]
name = "clipboardx"
version = "0.1.0"
description = "Private local clipboard history for COSMIC Wayland"
authors = ["ClipboardX contributors"]
edition = "2021"


[lib]
name = "clipboardx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"], default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-single-instance = "2.5.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }


[profile.release]
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.4"
nix = { version = "0.31.3", features = ["poll"] }
wayland-client = "0.31.15"
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
