# Publishes the download page and the installers.
# Signing runs when these secrets exist:
# Windows: WINDOWS_CERTIFICATE (base64 pfx), WINDOWS_CERTIFICATE_PASSWORD
# Mac: APPLE_CERTIFICATE (base64 p12), APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
name: Publish

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - ".github/workflows/publish.yml"
      - "site/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb
            installer: ClipboardX.deb
          - name: windows
            os: windows-latest
            args: --bundles nsis
            installer: ClipboardX-Setup.exe
          - name: macos
            os: macos-latest
            args: --bundles dmg --target universal-apple-darwin
            installer: ClipboardX.dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: release-v1
          cache-on-failure: "true"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf mold

      - run: npm ci

      - name: Import the Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            exit 0
          fi
          password=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$password" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$RUNNER_TEMP/build.keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Import the Windows certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { exit 0 }
          $path = Join-Path $env:RUNNER_TEMP "clipboardx.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $path

      - name: Build the installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          if [ "$(uname -s)" = Linux ]; then
            mkdir -p src-tauri/.cargo
            printf '%s\n' '[target.x86_64-unknown-linux-gnu]' 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]' > src-tauri/.cargo/config.toml
          fi
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID
          [ -n "${APPLE_PASSWORD:-}" ] || unset APPLE_PASSWORD
          [ -n "${APPLE_TEAM_ID:-}" ] || unset APPLE_TEAM_ID
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || unset APPLE_SIGNING_IDENTITY
          config=()
          if [ -n "${WINDOWS_CERT_THUMBPRINT:-}" ]; then
            config+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_CERT_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          npm run tauri -- build ${{ matrix.args }} "${config[@]}"
          mkdir -p dist
          found=$(find src-tauri/target -type f -path '*/bundle/*' \( -name '*.deb' -o -name '*-setup.exe' -o -name '*.dmg' \) -print -quit)
          test -n "$found"
          cp "$found" "dist/${{ matrix.installer }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist/${{ matrix.installer }}
          if-no-files-found: error

  publish:
    name: Publish the download
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Update the stable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/ClipboardX-Setup.exe
          test -f dist/ClipboardX.dmg
          test -f dist/ClipboardX.deb
          if gh release view stable >/dev/null 2>&1; then
            gh release upload stable dist/ClipboardX-Setup.exe dist/ClipboardX.dmg dist/ClipboardX.deb --clobber
          else
            gh release create stable dist/ClipboardX-Setup.exe dist/ClipboardX.dmg dist/ClipboardX.deb --latest --title "ClipboardX" --notes "Windows, Mac, and Linux downloads."
          fi
          gh release edit stable --latest

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
